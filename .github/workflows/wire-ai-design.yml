name: Wire Qwen AI design mode
on:
  push:
    branches: [main]
    paths:
      - 'ai_design.py'
      - '.github/workflows/wire-ai-design.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire module into app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          import_line = 'from ai_design import render_ai_design_mode\n'
          if import_line not in s:
              anchor = 'from docx.oxml.ns import qn\n'
              if anchor not in s:
                  raise SystemExit('Import anchor not found')
              s = s.replace(anchor, anchor + import_line, 1)

          old = '''            with st.expander("🎨 Diseños y plantillas", expanded=False):\n                render_editable_clean_templates(st.session_state.menu_data)'''
          new = '''            with st.expander("🎨 Diseños y plantillas", expanded=False):\n                render_ai_design_mode(st.session_state.menu_data, ICON_MAP)\n                st.divider()\n                render_editable_clean_templates(st.session_state.menu_data)'''
          if new not in s:
              if old not in s:
                  raise SystemExit('Design expander anchor not found')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile application
        run: |
          python -m py_compile app.py ai_design.py
          grep -F 'from ai_design import render_ai_design_mode' app.py
          grep -F 'render_ai_design_mode(st.session_state.menu_data, ICON_MAP)' app.py
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Integrate Qwen AI menu design mode'
          git push
