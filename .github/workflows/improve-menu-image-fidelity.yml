name: Improve menu image fidelity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/improve_menu_image_fidelity.py'
      - '.github/workflows/improve-menu-image-fidelity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply image fidelity patch
        run: python scripts/improve_menu_image_fidelity.py
      - name: Verify source
        run: |
          python -m py_compile app.py qwen_core.py
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          qwen = Path('qwen_core.py').read_text(encoding='utf-8')
          assert 'MAX_IMAGE_SIDE = 3200' in app
          assert 'clean = BytesIO()' not in app[app.index('def prepare_image_for_ai'):app.index('def normalize_allergen_key')]
          assert 'quality=94, optimize=True, subsampling=0' in qwen
          print('PASS high-fidelity menu image preprocessing')
          PY
      - name: Commit runtime fix
        run: |
          if git diff --quiet -- app.py qwen_core.py; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py qwen_core.py
          git commit -m 'Preserve menu image detail for Qwen vision'
          git push
