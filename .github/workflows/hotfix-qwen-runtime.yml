name: Hotfix Qwen runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hotfix-qwen-runtime.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hotfix
        run: python scripts/hotfix_qwen_runtime.py
      - name: Compile
        run: python -m py_compile app.py qwen_core.py ai_design.py
      - name: Verify runtime guards
        run: |
          python - <<'PY'
          from pathlib import Path
          q = Path('qwen_core.py').read_text(encoding='utf-8')
          a = Path('app.py').read_text(encoding='utf-8')
          d = Path('ai_design.py').read_text(encoding='utf-8')
          assert 'reasoning_effort="medium"' in q
          assert 'purpose="allergen_reasoning_fallback"' in q
          assert 'json_object=True' in q
          assert 'DASHSCOPE_API_HOST' in q and 'DASHSCOPE_API_HOST' in d
          assert 'no los dejes vacíos por defecto' in a
          # Permanent visual rule: price precedes allergen icons.
          wp = a.index('price_run = p.add_run("\\t" + format_price(dish.get("price", "")))')
          wi = a.index('_add_allergen_icons_to_run(p, dish.get("allergens", []), width_cm=0.75)', wp)
          assert wp < wi
          pp = a.index('f\'<span class="price">{html_escape(format_price(dish.get("price", "")))}</span>\'')
          pi = a.index('f\'<span class="dish-icons">{icons}</span></div>{desc_html}</div>\'', pp)
          assert pp < pi
          print('runtime guards OK')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py qwen_core.py ai_design.py
          git commit -m 'Fix Qwen runtime latency and allergen fallback'
          git push
