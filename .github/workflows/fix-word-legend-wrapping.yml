name: Fix Carta IA Word legend wrapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-word-legend-wrapping.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile repair
        run: python -m py_compile scripts/fix_word_legend_wrapping.py

      - name: Apply Word legend repair
        run: python scripts/fix_word_legend_wrapping.py

      - name: Compile application and patch source
        run: python -m py_compile app.py scripts/v12_export_polish.py

      - name: Commit Word legend repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/v12_export_polish.py scripts/fix_word_legend_wrapping.py
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Prevent Word allergen labels from splitting'
          git push origin HEAD:main
