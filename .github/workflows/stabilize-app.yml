name: Simplify Carta IA client flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic patch
        run: python scripts/client_ux_patch.py

      - name: Compile and verify
        run: |
          python -m py_compile app.py serval_eider_patch/sitecustomize.py scripts/client_ux_patch.py
          python scripts/client_ux_patch.py

      - name: Commit client-friendly update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py serval_eider_patch/sitecustomize.py serval_eider_patch/setup.py
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Simplify client UI and enlarge allergen visuals'
          git push origin HEAD:main
