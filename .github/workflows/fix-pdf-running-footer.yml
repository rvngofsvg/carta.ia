name: Fix Carta IA PDF running footer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pdf-running-footer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile repair
        run: python -m py_compile scripts/fix_pdf_running_footer.py

      - name: Apply running-footer repair
        run: python scripts/fix_pdf_running_footer.py

      - name: Compile application
        run: python -m py_compile app.py

      - name: Commit PDF footer repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/fix_pdf_running_footer.py
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Fix PDF allergen footer with running element'
          git push origin HEAD:main
