name: Apply Carta IA v12 core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v12-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair v12 patch source
        run: python scripts/fix_v12_source.py

      - name: Compile migration script
        run: python -m py_compile scripts/v12_core_patch.py

      - name: Apply v12 core patch
        run: python scripts/v12_core_patch.py

      - name: Compile patched sources
        run: |
          python -m py_compile app.py scripts/v12_core_patch.py serval_eider_patch/sitecustomize.py

      - name: Verify core invariants
        run: |
          grep -q 'gemini-3.8-flash' app.py
          grep -q 'gemini-3.1-pro-preview' app.py
          grep -q 'WORD CON ALÉRGENOS' app.py
          grep -q 'PDF CON ALÉRGENOS' app.py
          grep -q 'WORD SIN ALÉRGENOS' app.py
          grep -q 'PDF SIN ALÉRGENOS' app.py
          grep -q 'google-genai==2.29.0' requirements.txt

      - name: Commit v12 core
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py requirements.txt serval_eider_patch/sitecustomize.py scripts/v12_core_patch.py scripts/fix_v12_source.py
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Simplify outputs and upgrade allergen intelligence'
          git push origin HEAD:main
