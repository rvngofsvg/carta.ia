name: Verify Eider source artwork

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify committed artwork
        run: |
          python -m pip install --quiet Pillow==12.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          path = Path('serval_eider_patch/leyenda_alergenos_eider.png')
          raw = path.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          img = Image.open(path)
          assert img.size == (1651, 239), img.size
          assert digest == '795b8c438d81bd716bd1048787dc448345f424a6f030d59ebdacddb979cc8f91', digest
          print('PASS', path, img.size, digest)
          PY
