name: Validate Eider Word footer

# QA trigger: client UX + allergen sizing update 2026-10-08
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx==1.2.0 Pillow==12.3.0
          python -m pip install ./serval_eider_patch

      - name: Generate and structurally validate Word outputs
        run: |
          mkdir -p qa
          python - <<'PY'
          from pathlib import Path
          import zipfile
          from docx import Document
          from docx.enum.section import WD_ORIENT
          from docx.shared import Cm
          import sitecustomize

          qa = Path('qa')
          assert sitecustomize._ICON_DIR is not None, 'Los iconos empaquetados no se localizaron'
          assert all((sitecustomize._ICON_DIR / filename).is_file() for _, filename in sitecustomize.LEGEND_ITEMS)
          assert sitecustomize.INLINE_ICON_MIN_CM >= 0.75, sitecustomize.INLINE_ICON_MIN_CM
          print('ICON_DIR', sitecustomize._ICON_DIR)

          icon_test = Document()
          p_icon = icon_test.add_paragraph('Queso Manchego Viejo  ')
          shape = p_icon.add_run().add_picture('Public/Iconos/lacteos.png', width=Cm(0.34))
          assert shape.width >= Cm(sitecustomize.INLINE_ICON_MIN_CM), (shape.width, Cm(sitecustomize.INLINE_ICON_MIN_CM))
          icon_test.save(qa / 'qa_inline_icon.docx')

          p = Document()
          p.sections[0].bottom_margin = Cm(1.0)
          p.add_heading('QA VERTICAL', 0)
          for i in range(36):
              p.add_paragraph(f'Plato {i+1} ........................ 12,00€ — descripción de prueba.')
          p.add_paragraph('GUÍA DE ALÉRGENOS')
          t = p.add_table(rows=2, cols=7)
          labels = ['GLUTEN','CRUSTÁCEOS','HUEVOS','PESCADO','CACAHUETES','SOJA','LÁCTEOS','FRUTOS DE CÁSCARA','APIO','MOSTAZA','SÉSAMO','SULFITOS','ALTRAMUCES','MOLUSCOS']
          for i, label in enumerate(labels):
              t.cell(0 if i < 7 else 1, i if i < 7 else i-7).text = label
          p.add_paragraph('Información orientativa basada en carta. Debe validarse con ingredientes reales.')
          p.save(qa / 'qa_vertical.docx')

          l = Document()
          s = l.sections[0]
          s.orientation = WD_ORIENT.LANDSCAPE
          s.page_width = Cm(29.7)
          s.page_height = Cm(21.0)
          s.left_margin = Cm(0.8)
          s.right_margin = Cm(0.8)
          s.bottom_margin = Cm(1.0)
          l.add_heading('QA HORIZONTAL / LIBRO', 0)
          for i in range(30):
              l.add_paragraph(f'{i+1}. Plato de prueba  [GLU] [HUE]                         14,50€')
          l.add_paragraph('GUÍA DE ALÉRGENOS')
          lt = l.add_table(rows=2, cols=7)
          for i, label in enumerate(labels):
              lt.cell(0 if i < 7 else 1, i if i < 7 else i-7).text = label
          l.save(qa / 'qa_horizontal.docx')

          clean = Document()
          clean.sections[0].bottom_margin = Cm(1.0)
          clean.sections[0].footer.paragraphs[0].text = 'FOOTER LIMPIO'
          clean.add_paragraph('Carta final sin alérgenos')
          clean.save(qa / 'qa_clean.docx')

          def footer_xml(path):
              with zipfile.ZipFile(path) as z:
                  return [z.read(n).decode('utf-8') for n in z.namelist() if n.startswith('word/footer') and n.endswith('.xml')]

          def check_allergen_docx(path, landscape=False):
              with zipfile.ZipFile(path) as z:
                  doc_xml = z.read('word/document.xml').decode('utf-8')
                  assert 'GUÍA DE ALÉRGENOS' not in doc_xml, 'La leyenda antigua sigue en el body'
                  footers = [z.read(n).decode('utf-8') for n in z.namelist() if n.startswith('word/footer') and n.endswith('.xml')]
                  assert footers, 'No hay footer XML'
                  richest = max(footers, key=lambda x: x.count('<w:drawing'))
                  drawings = richest.count('<w:drawing')
                  assert sitecustomize.LEGAL_TEXT.split(',')[0] in richest
                  assert 'GLUTEN' in richest and 'MOLUSCOS' in richest
                  if landscape:
                      assert drawings >= 28, f'Libro necesita 28 iconos en el footer principal; drawings={drawings}'
                  else:
                      assert drawings >= 14, f'Vertical necesita 14 iconos; drawings={drawings}'

              reopened = Document(path)
              for sec in reopened.sections:
                  if landscape:
                      assert sec.bottom_margin >= Cm(5.4)
                  else:
                      assert sec.bottom_margin >= Cm(6.1)
              print('PASS', path)

          check_allergen_docx(qa / 'qa_vertical.docx', landscape=False)
          check_allergen_docx(qa / 'qa_horizontal.docx', landscape=True)

          clean_reopened = Document(qa / 'qa_clean.docx')
          assert clean_reopened.sections[0].bottom_margin < Cm(2.0), 'El Word sin alérgenos fue modificado'
          clean_footers = footer_xml(qa / 'qa_clean.docx')
          assert any('FOOTER LIMPIO' in f for f in clean_footers)
          assert not any('GLUTEN' in f or sitecustomize.LEGAL_TEXT.split(',')[0] in f for f in clean_footers)
          print('PASS clean document isolation')

          (qa / 'qa_report.txt').write_text(
              'PASS\n'
              f'icon_dir={sitecustomize._ICON_DIR}\n'
              f'inline_min_cm={sitecustomize.INLINE_ICON_MIN_CM}\n'
              'portrait_footer=2x7 native icons enlarged\n'
              'clean_doc_untouched=yes\n',
              encoding='utf-8'
          )
          PY

      - name: Install renderer
        if: success()
        run: |
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
          fi

      - name: Render Word outputs
        if: success()
        run: |
          mkdir -p qa/rendered
          libreoffice --headless --convert-to pdf --outdir qa/rendered qa/qa_vertical.docx
          libreoffice --headless --convert-to pdf --outdir qa/rendered qa/qa_horizontal.docx
          libreoffice --headless --convert-to pdf --outdir qa/rendered qa/qa_inline_icon.docx
          pdftoppm -png -r 120 qa/rendered/qa_vertical.pdf qa/rendered/vertical
          pdftoppm -png -r 120 qa/rendered/qa_horizontal.pdf qa/rendered/horizontal
          pdftoppm -png -r 120 qa/rendered/qa_inline_icon.pdf qa/rendered/inline
          ls -lah qa qa/rendered

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eider-footer-qa
          path: qa/
          if-no-files-found: warn
