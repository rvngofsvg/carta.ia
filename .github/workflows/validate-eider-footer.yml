name: Validate Carta IA core

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      DASHSCOPE_API_KEY: dummy-qa-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate exports and image fallback
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import zipfile
          from PIL import Image
          from pypdf import PdfReader
          from docx import Document
          from docx.shared import Cm
          import qwen_core
          import app

          data = {
              'restaurant_name':'QA Restaurante',
              'texto_extra':'',
              'categories':[{'name':'Entrantes','category_text':'','dishes':[
                  {'number':'1','name':'Croquetas','description':'','price':'9,50','allergens':['gluten','huevos','lacteos'],'review_notes':[]}
              ]}],
          }

          word = app.create_word(data, theme_key='neutral')
          clean_word = app.create_client_word_without_allergens(data, theme_key='neutral')
          pdf = app.create_client_pdf_bytes(data, theme_key='neutral', with_allergens=True)
          clean_pdf = app.create_client_pdf_bytes(data, theme_key='neutral', with_allergens=False)
          assert pdf.startswith(b'%PDF') and clean_pdf.startswith(b'%PDF')
          pdf_text = '\n'.join((p.extract_text() or '') for p in PdfReader(BytesIO(pdf)).pages)
          clean_pdf_text = '\n'.join((p.extract_text() or '') for p in PdfReader(BytesIO(clean_pdf)).pages)
          assert 'Reglamento de la UE 1169/2011' in pdf_text
          assert 'GLUTEN' in pdf_text and 'MOLUSCOS' in pdf_text
          assert 'Reglamento de la UE 1169/2011' not in clean_pdf_text

          Path('qa_word.docx').write_bytes(word.getvalue())
          Path('qa_clean_word.docx').write_bytes(clean_word.getvalue())
          reopened = Document('qa_word.docx')
          assert any(Cm(0.40) <= s.width <= Cm(0.55) for s in reopened.inline_shapes)
          with zipfile.ZipFile('qa_word.docx') as z:
              footers = [z.read(n).decode('utf-8') for n in z.namelist() if n.startswith('word/footer') and n.endswith('.xml')]
              richest = max(footers, key=lambda x: x.count('<w:drawing'))
              assert richest.count('<w:drawing') >= 14
              assert 'w:val="nil"' in richest
          with zipfile.ZipFile('qa_clean_word.docx') as z:
              footers = [z.read(n).decode('utf-8') for n in z.namelist() if n.startswith('word/footer') and n.endswith('.xml')]
              assert not any('GLUTEN' in x or '<w:drawing' in x for x in footers)

          source = Path('app.py').read_text(encoding='utf-8')
          qsource = Path('qwen_core.py').read_text(encoding='utf-8')
          assert 'grid-template-columns: 1fr 1.12fr .92fr .98fr 1.22fr 1.02fr 1fr;' in source
          assert 'height: 12.4mm;' in source and 'font-size: 6.8pt;' in source
          assert 'DIÓXIDO DE<br>AZUFRE Y SULFITOS' in source
          assert 'menu_structure_image_omni_fallback' in qsource
          assert 'menu_structure_image_max_fallback' in qsource

          valid = '{"restaurant_name":"QA","texto_extra":"","categories":[{"name":"Entrantes","category_text":"","dishes":[{"number":"1","name":"Croquetas","description":"","price":"9,50","allergens":[],"review_notes":[]}]}]}'
          calls = []
          original = qwen_core.chat
          def fake_chat(messages, model=qwen_core.QWEN_FLASH, purpose='general', **kwargs):
              calls.append(model)
              if model == qwen_core.QWEN_FLASH:
                  return '[]', {}
              if model == qwen_core.QWEN_OMNI:
                  return valid, {}
              raise AssertionError('Max no debe ejecutarse si Omni recupera la carta')
          qwen_core.chat = fake_chat
          try:
              recovered = qwen_core.menu_json_from_image('Extrae la carta', Image.new('RGB',(120,80),'white'))
          finally:
              qwen_core.chat = original
          assert recovered['categories'][0]['dishes'][0]['name'] == 'Croquetas'
          assert calls == [qwen_core.QWEN_FLASH, qwen_core.QWEN_OMNI]
          print('PASS Carta IA core + Qwen image empty-array fallback')
          PY
