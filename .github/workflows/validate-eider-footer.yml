name: Validate Carta IA core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      DASHSCOPE_API_KEY: dummy-qa-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          xargs -a packages.txt sudo apt-get install -y
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate original artwork, exports, UI and API contracts offline
        run: python qa/test_regressions.py
